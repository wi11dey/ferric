name: ferric
version: 1.0
dependencies:
  - aeson
  - base
  - bytestring
  - containers
  - directory
  - filepath
  - free
  - http-conduit
  - linear-base
  - process
  - template-haskell
  - zstd
default-extensions:
  - BlockArguments
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - DerivingStrategies
  - GeneralizedNewtypeDeriving
  - LinearTypes
  - NamedFieldPuns
  - RecordWildCards
  - TemplateHaskell
ghc-options:
  - -Wall
  - -ddump-splices
  - -ddump-to-file
library:
  source-dirs: src
tests:
  webrender:
    main: Test.hs
    source-dirs: test
    dependencies: ferric
