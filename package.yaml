name: ferric
version: 1.0
dependencies:
  - aeson
  - base
  - bytestring
  - containers
  - data-fix
  - http-conduit
  - template-haskell
  - zstd
default-extensions:
  - DeriveAnyClass
  - DeriveFunctor
  - DeriveGeneric
  - NamedFieldPuns
  - RecordWildCards
  - TemplateHaskell
  - ViewPatterns
ghc-options:
  - -Wall
library:
  source-dirs: src
  exposed-modules:
    - Ferric
